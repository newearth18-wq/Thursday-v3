[project]
name = "thursday"
version = "0.1.0"
description = "Thursday — a personal AI operating system. One assistant, many capabilities."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "websockets>=13",
    "structlog>=24.1",
    "psutil>=6.0",
    "python-multipart>=0.0.9",
    # Device identity is Ed25519 (Sprint 36). A core dependency rather than an extra: a
    # deployment that could not verify which node it is talking to is not a deployment that
    # should start.
    "cryptography>=43.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29", "pgvector>=0.3"]
redis = ["redis>=5.0", "dramatiq[redis]>=1.17"]
browser = ["playwright>=1.47"]
# openWakeWord is what a real deployment would use for wake-word detection on raw audio,
# but it pulls tflite-runtime, which publishes no wheels for the Python this project
# requires. Listing it made the extra uninstallable, and nothing imports it — the
# WakeWord port is what the code depends on. See packages/voice/thursday_voice/providers.py.
voice = ["faster-whisper>=1.0", "sounddevice>=0.4"]
vision = ["opencv-python>=4.10", "mediapipe>=0.10", "onnxruntime>=1.19"]
# Sprint 83 (EASY INSTALL). What builds `installer/sidecar_main.py` into the single binary
# Tauri embeds as its sidecar — not something the running app or its tests need, so it is
# its own extra rather than folded into `dev`.
installer = ["pyinstaller>=6.10"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
thursday = "apps.cli.__main__:main"
thursday-server = "apps.server.__main__:main"
thursday-node = "apps.node.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# PART 3's tree as one distribution: eleven source packages, three services, four apps.
# See docs/architecture/decisions/0005-monorepo-package-split.md for why not eleven wheels.
packages = [
    "packages/shared/thursday_shared",
    "packages/core/thursday_core",
    "packages/agents/thursday_agents",
    "packages/tools/thursday_tools",
    "packages/memory/thursday_memory",
    "packages/voice/thursday_voice",
    "packages/vision/thursday_vision",
    "packages/security/thursday_security",
    "packages/automation/thursday_automation",
    "packages/devices/thursday_devices",
    "packages/models/thursday_models",
    "services/api/thursday_api",
    "services/worker/thursday_worker",
    "services/realtime/thursday_realtime",
    "apps",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "N818",
    "ASYNC109",
    "E501",    # long lines are caught by the formatter, not the linter
    "S101",    # asserts are how tests assert
    "RUF001",  # Thai text legitimately contains characters that look ambiguous
    "RUF002",
    "RUF003",
    "B008",    # FastAPI's Depends() in defaults is the framework's idiom
]

# N818: Thursday's exceptions are named for what happened (PermissionDenied,
#       ApprovalRequired), which reads better at the call site than an -Error suffix.
# ASYNC109: timeouts travel *through* the node protocol as part of the action contract,
#       so the parameter belongs on the signature rather than at every call site.

[tool.ruff.lint.per-file-ignores]
# Tests assert on paths directly; the blocking call is irrelevant in a test body.
"tests/**" = ["S", "N806", "ASYNC240"]
"database/migrations/**" = ["N999", "E", "F", "I", "UP"]
# Shelling out is the adapters' entire job; path *resolution* is in-memory and the real
# file I/O is already dispatched to worker threads.
"packages/devices/thursday_devices/node/adapters/*.py" = ["S602", "S603", "S607", "ASYNC240"]
"packages/devices/thursday_devices/node/executor.py" = ["S324"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A dev checkout runs without `pip install -e .` reinstalls after a package move.
pythonpath = [
    ".",
    "packages/shared", "packages/core", "packages/agents", "packages/tools",
    "packages/memory", "packages/voice", "packages/vision", "packages/security",
    "packages/automation", "packages/devices", "packages/models",
    "services/api", "services/worker", "services/realtime",
]
