# Fast checks only. Anything slower than a couple of seconds belongs in CI, not in the way
# of a commit.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=512]
      # Thursday's own rule, applied to Thursday's repository: no credentials in the tree.
      - id: detect-private-key

  - repo: local
    hooks:
      - id: no-secrets-in-source
        name: no credential material in source
        entry: python scripts/check_no_secrets.py
        language: system
        pass_filenames: true
        types: [text]
