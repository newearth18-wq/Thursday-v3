[package]
name = "thursday-desktop"
version = "0.2.0"
description = "Thursday — personal AI operating system"
authors = ["Thursday"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what makes a transparent window transparent on macOS; without it
# the avatar is a white rectangle over the owner's desktop. It is a private API, so it is
# named here rather than turned on quietly: an App Store build would have to drop it, and
# would then have to drop the avatar window with it.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Used only by the tray's emergency stop, which must not depend on the webview being
# responsive to reach the API.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `tauri::async_runtime` re-exports tokio's channels but not its timer — Cargo does not
# make a transitive dependency's API nameable, so the sidecar's health-poll interval needs
# this listed directly, even though the same tokio is already resolved via tauri itself.
tokio = { version = "1", features = ["time"] }

[features]
# Tauri strips the console window on Windows release builds.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
