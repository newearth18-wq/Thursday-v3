[package]
name = "thursday-desktop"
version = "0.2.0"
description = "Thursday — personal AI operating system"
authors = ["Thursday"]
edition = "2021"
rust-version = "1.77"

# Sprint 84. A mobile build has no `main()` of its own — the Android/iOS launcher calls
# into a library directly, at the function `tauri::mobile_entry_point` marks (see lib.rs) —
# so the app has to exist as a library as well as the desktop binary `main.rs` still builds.
# `staticlib`/`cdylib` are what Android's and iOS's own build systems link against; `rlib` is
# what lets `main.rs` on desktop keep calling it like any other crate.
[lib]
name = "thursday_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what makes a transparent window transparent on macOS; without it
# the avatar is a white rectangle over the owner's desktop. It is a private API, so it is
# named here rather than turned on quietly: an App Store build would have to drop it, and
# would then have to drop the avatar window with it.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Used only by the tray's emergency stop, which must not depend on the webview being
# responsive to reach the API.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `tauri::async_runtime` re-exports tokio's channels but not its timer — Cargo does not
# make a transitive dependency's API nameable, so the sidecar's health-poll interval needs
# this listed directly, even though the same tokio is already resolved via tauri itself.
tokio = { version = "1", features = ["time"] }

# Desktop only, and declared per-target rather than behind a Cargo feature because that is
# how Tauri ships it: mobile has one Activity per app and no second process to guard against.
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[features]
# Tauri strips the console window on Windows release builds.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
