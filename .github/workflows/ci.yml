name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # The suite needs no database, no Redis, no model credentials and no GUI —
      # that is a design requirement, not a convenience.
      - name: Test
        run: uv run pytest -q --cov=thursday --cov-report=term-missing

      - name: Migrations apply from empty
        run: |
          mkdir -p var
          uv run alembic upgrade head
          uv run alembic check
