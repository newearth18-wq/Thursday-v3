name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The project requires 3.12 (PEP 695 generics are used in the source), so the
        # floor and the current release are what CI proves.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      # Put the venv on PATH and call the tools directly rather than through `uv run`.
      # `uv run` re-resolves the whole dependency graph across every Python the project
      # claims to support, which can fail for a version this job is not even running —
      # and it would not be running the environment the install step just built. These
      # are the same commands scripts/check.sh runs locally.
      - name: Use the project environment
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # The suite needs no database, no Redis, no model credentials and no GUI —
      # that is a design requirement, not a convenience.
      - name: Test
        run: pytest -q --cov=packages --cov=services --cov-report=term-missing

      - name: Migrations apply from empty, and match the models
        run: |
          mkdir -p var
          alembic upgrade head
          alembic check

      - name: Seeds are idempotent
        run: |
          python -m database.seeds
          python -m database.seeds

      - name: No secrets in tracked files
        run: python scripts/check_no_secrets.py

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # tsc and the bundler resolve module paths independently, so one can pass while
      # the other fails. Both run, or neither is worth running.
      # ci, not install: the lockfile is committed, so the build is the same one
      # a contributor gets.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # What a person is shown is decided in these files, so the decisions are tested
      # rather than eyeballed: which face goes with which state, and whether an internal
      # name can reach the screen.
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # The desktop shell was never compiled by anything, and it did not compile: the icons
  # `tauri.conf.json` points at were not in the repository, so `tauri::generate_context!`
  # failed on a clean checkout. Nobody noticed because nothing ever tried.
  # No `defaults.run.working-directory` on this job, unlike `desktop` above — its steps are
  # a genuine mix of repo-root (the backend, the sidecar) and apps/desktop (the frontend,
  # the Rust), and a shared default would make each step's actual directory a fact you have
  # to hold in your head rather than one you can read off the step itself.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System libraries Tauri links against
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
                                  libjavascriptcoregtk-4.1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # `generate_context!` reads `frontendDist` and fails if it is missing, so the bundle
      # has to exist before the Rust is compiled — the same order a real build uses. The
      # first version of this job skipped it and failed here, which is the job working.
      - name: Build the frontend the shell embeds
        working-directory: apps/desktop
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12

      # Sprint 83: once `bundle.externalBin` is set, `tauri-build`'s build script copies
      # whatever it names on *every* `cargo build` — not only `tauri build` — so a missing
      # sidecar now fails compilation here, the same way the missing icons failed it before.
      - name: Install the backend, to build its sidecar from
        run: |
          uv venv --python 3.12
          uv pip install -e ".[installer]"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Build the sidecar the shell embeds
        run: |
          source .venv/bin/activate
          bash scripts/build_sidecar.sh

      # check, not build: a full bundle needs signing identities and takes minutes. What
      # matters here is that the Rust, the config, the frontend and the sidecar all agree.
      # `cargo test` alongside it: `sidecar::should_spawn`'s three unit tests, cheap enough
      # to run beside a check that was already compiling everything.
      - name: Check
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test

  # What Sprint 83 actually ships: the packaged .exe an owner double-clicks, built and
  # bundled on a real Windows runner because PyInstaller does not cross-compile — this is
  # the one job that can prove `bundle.externalBin` resolves and a real NSIS installer comes
  # out the other end.
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12

      - name: Install the backend, to build its sidecar from
        run: |
          uv venv --python 3.12
          uv pip install -e ".[installer]"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the frontend
        working-directory: apps/desktop
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # PyInstaller does not cross-compile, so this is the one job that can build it.
      - name: Build the sidecar
        shell: bash
        run: |
          source .venv/Scripts/activate
          bash scripts/build_sidecar.sh

      # NSIS is what a normal user runs: one .exe, no separate Python or Node install step,
      # no terminal — the whole claim EASY INSTALL makes, produced by CI rather than
      # asserted by a README.
      - name: Build the installer
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: thursday-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Sprint 84, ADR 0057: the same shell, wrapped for Android instead of started fresh for
  # it. `gen/android` is generated here, not committed — the same reason `binaries/` is
  # not — and this is the first thing in the project that has ever run `tauri android
  # init` or produced a real .apk; no Android SDK/NDK/emulator existed in the environment
  # this was built in to verify any of it beyond source-level readiness (see the ADR).
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12

      # No sidecar on Android (ADR 0057) — the frontend is what this job needs, not the
      # backend.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the frontend
        working-directory: apps/desktop
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Generate the Android project
        working-directory: apps/desktop
        run: npx tauri android init

      # A debug build: no signing configuration exists for this project, and the point of
      # this job is proving the mechanism (Rust cross-compiles, the frontend loads, an
      # .apk comes out) rather than producing something to actually publish.
      - name: Build the .apk
        working-directory: apps/desktop
        run: npx tauri android build --target aarch64 --apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: thursday-android-debug
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
